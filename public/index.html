<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Faktur Excel to XML Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f9fafb;
      color: #111827;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .btn-download {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background-color: #f3f4f6;
      color: #374151;
      text-decoration: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-download:hover {
      background-color: #e5e7eb;
    }
    .btn-submit {
      padding: 10px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-submit:hover {
      background-color: #1d4ed8;
    }
    .file-input {
      margin-bottom: 20px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>e-Faktur Excel to XML Converter</h2>
    <p>Upload your filled Excel file to generate the DJP-compliant XML file.</p>
    
    <!-- Template Download Button -->
    <div>
      <a href="/Template_eFaktur.xlsx" download="Template_eFaktur.xlsx" class="btn-download">
        📥 Download Excel Template
      </a>
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 20px 0;">

    <!-- Form for Conversion -->
    <form action="/api/convert" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".xlsx, .xls" required class="file-input">
      <button type="submit" class="btn-submit">Convert & Download XML</button>
    </form>
  </div>

</body>
</html>
